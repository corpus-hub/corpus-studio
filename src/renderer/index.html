<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP fallback (the main process injects the AUTHORITATIVE header via
      onHeadersReceived). `frame-ancestors` is intentionally omitted here: it is
      ignored — and logs a console error — when delivered via <meta>; it is
      enforced by the HTTP header instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Corpus Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
